<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#365c42">
  <meta name="description" content="Короткое демонстрационное занятие: помогаем Ёжику с почтой, слушаем слова и знакомимся с буквой М.">
  <title>Лесная почта — игра с Ёжиком</title>
  <link rel="icon" href="../public/assets/props/raster-v1/envelope.webp">
  <link rel="stylesheet" href="demo.css">
  <script defer src="catalog.js"></script>
  <script defer src="lesson.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="soundscape.js"></script>
  <script defer src="drag.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main id="app" aria-label="Лесная почта"></main>
  <div id="sound-notice" class="sound-notice" hidden role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <div class="notice-card">
      <div class="notice-icon" aria-hidden="true">♪</div>
      <h2 id="notice-title">Продолжим слушать?</h2>
      <p id="notice-description"></p>
      <button id="resume-audio" class="primary">Включить звук</button>
      <button id="notice-reset" class="text-button">Начать заново</button>
    </div>
  </div>
  <div id="audio-settings" class="sound-notice" hidden role="dialog" aria-modal="true" aria-labelledby="audio-settings-title">
    <div class="notice-card audio-settings-card">
      <h2 id="audio-settings-title">Звуки лесной почты</h2>
      <label class="audio-setting"><span>Музыка</span><input id="music-enabled" type="checkbox" role="switch" checked></label>
      <label class="audio-setting"><span>Эффекты</span><input id="effects-enabled" type="checkbox" role="switch" checked></label>
      <p>Голос Ёжика остаётся включённым.</p>
      <button id="audio-settings-close" class="primary">Готово</button>
    </div>
  </div>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <aside id="presenter" class="presenter" hidden aria-label="Пульт для показа"></aside>
  <noscript><p>Для этого демо включите JavaScript в браузере.</p></noscript>
</body>
</html>
